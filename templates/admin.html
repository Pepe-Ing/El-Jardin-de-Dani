<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar catálogo</title><link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}"><script defer src="{{ url_for('static', filename='js/admin.js') }}"></script></head>
<body><header class="admin-header"><a href="/">← Ver tienda</a><h1>Administrar catálogo</h1><form method="post" action="/admin/logout"><button class="secondary">Cerrar sesión</button></form></header>
<main class="admin-layout"><section class="panel"><h2 id="formTitle">Agregar un arreglo</h2><form id="productForm">
<input type="hidden" id="productId"><label>Nombre<input id="name" maxlength="80" required placeholder="Ej. Ramo de rosas"></label>
<label>Descripción<textarea id="description" maxlength="240" required placeholder="Describe el arreglo"></textarea></label>
<div class="two"><label>Precio (S/)<input id="price" type="number" min="0" step="0.01" required></label><label>Categoría<input id="category" required placeholder="Ramos, Cajas..."></label></div>
<label>URL de imagen<input id="image" type="url" required placeholder="https://..."></label><div class="form-actions"><button class="primary" type="submit">Guardar producto</button><button class="secondary" type="button" id="cancelEdit">Limpiar</button></div><p id="formMessage" role="status"></p></form></section>
<section class="panel"><h2>Productos publicados</h2><p class="hint">Puedes editar el nombre, la descripción, el precio, la categoría y la foto.</p><div id="adminProducts">Cargando...</div></section></main></body></html>
